[workspace]
members = [
    "crates/core",
    "crates/webview"
]
resolver = "2"

[workspace.dependencies]
fluent-bundle = "0.15"
fluent-syntax = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.87"

[profile.release]
strip = true
opt-level = 3
panic = "abort"
