# .pre-commit-config.yaml
repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf  # Forbid files containing CRLF end-lines to be committed
      - id: remove-crlf  # Replace CRLF end-lines by LF ones before committing
      - id: forbid-tabs  # Forbid files containing tabs to be committed
      - id: remove-tabs  # Replace tabs by whitespaces before committing
        args: [--whitespaces-count, '2']  # defaults to: 4
      - id: chmod  # Set file permissions
        args: ['644']
        files: \.md$
      - id: insert-license  # Insert a short license disclaimer as a header comment in source files
        files: \.groovy$
        args:
          - --license-filepath
          - src/license_header.txt        # defaults to: LICENSE.txt
          - --comment-style
          - //                            # defaults to:  #
          - --use-current-year
          - --no-extra-eol                # see below
  - repo: local
    hooks:
      # 1. Format verification
      - id: rust-format
        name: Rust Format Check
        entry: ./format.sh --rust-check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: dart-format
        name: Dart Format Check
        entry: ./format.sh --dart-check
        language: system
        files: \.dart$
        pass_filenames: false

      - id: sh-format
        name: Shell Script Format Check
        entry: ./format.sh --sh-check
        language: system
        files: \.sh$
        pass_filenames: false
