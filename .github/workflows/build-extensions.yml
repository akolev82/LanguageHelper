name: Build VSCode and Antigravity extensions

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Extensions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Rust workspace tests
        run: cargo test --workspace --verbose

      - name: Build WebAssembly modules and extension bundle
        run: npm run build

      - name: Package VSIX Extensions
        run: |
          # Package the VSIX extension
          npx -y @vscode/vsce package --no-git-tag-version -o language-helper.vsix

          # Create dedicated copies for VSCode and Antigravity distributions
          cp language-helper.vsix language-helper-vscode.vsix
          cp language-helper.vsix language-helper-antigravity.vsix

      - name: Create Antigravity bundle archive
        run: |
          mkdir -p bundle
          cp language-helper.vsix bundle/
          cp -r media bundle/ 2>/dev/null || true
          cp -r docs bundle/ 2>/dev/null || true
          cp README.md LICENSE bundle/ 2>/dev/null || true
          (cd bundle && zip -r ../language-helper-bundle.zip .)

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: language-helper-extensions
          path: |
            *.vsix
            language-helper-bundle.zip
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.vsix
            language-helper-bundle.zip
          generate_release_notes: true
